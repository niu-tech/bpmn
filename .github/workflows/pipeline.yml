name: CI-CD Pipeline

# CI roda em push e PR. PUBLICAR é SEMPRE um ato explícito — nunca efeito colateral de um push.
#
# Por que mudou: até 2026-11-10 o job de deploy rodava em todo push em `main` ou
# `ImproveSimulation`, o que significa que o primeiro push depois de versionar este arquivo
# publicaria na VPS sem ninguém decidir. Quem está empurrando um commit de trabalho não está
# pedindo um deploy.
#
# ⚠ PRE-REQUISITO do botao: o GitHub so oferece "Run workflow" para workflow presente na branch
# DEFAULT do repositorio. Hoje este arquivo existe so em `ImproveSimulation`. Enquanto nao estiver
# tambem na default, o CI roda em push normalmente, mas NAO ha como disparar o deploy pela UI.
#
# Como publicar: Actions -> "CI-CD Pipeline" -> Run workflow -> `deploy: true`.
# O job ainda exige o ambiente `production`, então, se o repositório tiver revisores configurados
# nele (Settings -> Environments -> production -> Required reviewers), a publicação só sai depois
# da aprovação. Sem revisores configurados, o `workflow_dispatch` com `deploy: true` já é o ato
# explícito.
#
# Rollback: `deploy/README.md`, seção "Rollback".

on:
  pull_request:
    branches: [main]
  push:
    # ImproveSimulation é a branch de trabalho atual; tirar da lista quando tudo estiver na main.
    branches: [main, ImproveSimulation]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publicar na VPS depois do CI (deixe desmarcado para só validar)'
        type: boolean
        default: false

jobs:
  ci:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Suíte do repositório: simulação em lote + protocolo/sessão/worklets/segurança do ajudante.
      # Nenhum teste aqui faz rede ou pede credencial — a prova viva é opt-in por GEMINI_API_KEY.
      - name: Test
        run: npm test

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config

      - name: Build Docker image
        run: docker build -t bpmn:ci .

      # O erro mais provável é página/diagrama que o dev server serve mas o build não copia p/ a imagem.
      - name: Smoke test
        run: |
          docker run -d --name bpmn-smoke -p 8080:80 bpmn:ci
          for p in / /viewer.html /bundle.js /viewer.js /pizza-collaboration.bpmn; do
            curl -fsS --retry 5 --retry-connrefused --retry-delay 1 -o /dev/null "http://127.0.0.1:8080$p"
          done

      # Guarda de segredo na imagem: nenhuma chave do Google pode ter entrado no bundle servido.
      # O produto é BYOK — a chave é digitada pelo visitante, então QUALQUER ocorrência aqui é
      # vazamento, não configuração.
      - name: No API key in the shipped bundle
        run: |
          docker cp bpmn-smoke:/usr/share/nginx/html ./shipped
          if grep -rIEl 'AIza[0-9A-Za-z_-]{10,}|\bAQ\.[0-9A-Za-z_.-]{20,}' ./shipped; then
            echo "::error::credencial encontrada nos arquivos servidos"
            exit 1
          fi
          echo "nenhuma credencial nos arquivos servidos"

  deploy:
    name: Deploy to Server (manual)
    runs-on: ubuntu-latest
    needs: ci
    # Só por acionamento manual E com a caixa marcada. Push e PR nunca publicam.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    # Exige o ambiente `production`: é onde se configuram revisores obrigatórios, se quiser que a
    # publicação passe por aprovação de alguém.
    environment: production

    steps:
      - name: Run remote deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ vars.SSH_PORT != '' && vars.SSH_PORT || '22' }}
          # ponytail: o build roda na própria VPS (como no javis.docker); se ela ficar apertada, buildar aqui e publicar a imagem num registry
          script: |
            set -e
            APP_DIR="$HOME/github/bpmn"
            [ -d "$APP_DIR/.git" ] || git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
            cd "$APP_DIR"
            git fetch origin "${{ github.ref_name }}"
            git checkout -f -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
            # Compose v1 (`docker-compose`) foi aposentado; instalacoes novas so trazem o plugin
            # v2 (`docker compose`). Escolher na hora evita o deploy morrer no ultimo passo por
            # causa do nome do binario.
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "nem 'docker compose' nem 'docker-compose' disponiveis na VPS" >&2
              exit 1
            fi
            echo "usando: $COMPOSE"
            $COMPOSE up -d --build
            $COMPOSE ps
