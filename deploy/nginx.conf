# nginx DENTRO do container (copiado pelo Dockerfile). Site estático puro.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    # bundle.js/viewer.js saem sem hash no nome ([name].js): sempre revalidar (ETag -> 304),
    # senão o navegador segue com o JS antigo depois de um deploy.
    add_header Cache-Control "no-cache" always;
}
