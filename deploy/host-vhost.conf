# Vhost de REFERÊNCIA para o nginx do HOST da VPS (o nginx do container só fala HTTP; o TLS fica aqui,
# mesmo padrão dos outros projetos niu-tech). Não é lido por nada automaticamente: aplicar à mão (ver README).
#
# Precisa ser um (sub)domínio próprio: as páginas usam caminhos absolutos (/bundle.js, /pizza-collaboration.bpmn).
server {
    listen 80;
    server_name bpmn.example.com;   # TROCAR pelo domínio real

    location / {
        proxy_pass http://127.0.0.1:8880;   # = BPMN_PORT do docker-compose.yml
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# TLS: `sudo certbot --nginx -d <dominio>` reescreve este bloco com o 443 + redirect.
# Se o host emite certificado de outro jeito, copie as linhas ssl_certificate de um vhost existente em /etc/nginx/sites-enabled/.
